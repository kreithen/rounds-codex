<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Rounds Codex — social 9:16</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
.canvas{position:relative;width:1080px;height:1920px;overflow:hidden;color:#fff;
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(circle at 50% 6%,#00b3ff3d,#0000 46%),
    radial-gradient(circle at 84% 40%,#36e8b733,#0000 40%),
    radial-gradient(circle at 12% 74%,#2878ff33,#0000 42%),
    linear-gradient(#020509,#050e1d 48%,#02060e)}
.canvas:before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 44%,#0000 60%,#0006);pointer-events:none}
.inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:84px 74px 76px}
.logo{width:400px;height:auto}
.pill{display:inline-flex;align-items:center;gap:.7rem;margin-top:40px;padding:16px 30px;border-radius:999px;
  background:#0f2a3a70;border:1px solid #46f2ad66;color:#c9fff0;font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.pill i{width:16px;height:16px;border-radius:50%;background:#46f2ad;box-shadow:0 0 18px #46f2ad}
h1{margin-top:40px;font-size:138px;line-height:.9;letter-spacing:-.045em;font-weight:850}
h1 .u{color:#0000;background:linear-gradient(120deg,#8fe0ff,#4bf1b0);-webkit-background-clip:text;background-clip:text}
.sub{margin-top:34px;max-width:820px;font-size:37px;line-height:1.4;color:#c3d1e6;font-weight:500}
.sub b{color:#fff;font-weight:800}
.phones{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:22px;margin:48px 0 70px}
.phones:before{content:"";position:absolute;inset:2% 6% 0;z-index:-1;filter:blur(70px);border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#2878ff70,#0000 46%),radial-gradient(circle at 62% 60%,#36e8b74d,#0000 46%)}
.ph{width:258px;aspect-ratio:.5;border:2px solid #7ab4ff55;border-radius:38px;padding:8px;background:linear-gradient(150deg,#17253d,#02050c);
  box-shadow:0 34px 80px #000b,inset 0 0 0 2px #ffffff0d;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:30px}
.ph.s{width:212px;opacity:.92}
.ph.l{transform:perspective(1400px) rotateY(20deg) rotate(-6deg) translateY(30px)}
.ph.r{transform:perspective(1400px) rotateY(-20deg) rotate(6deg) translateY(30px)}
.ph.c{z-index:2}
.free{font-size:76px;font-weight:900;letter-spacing:-.02em;
  color:#0000;background:linear-gradient(120deg,#fff,#8fe0ff 55%,#4bf1b0);-webkit-background-clip:text;background-clip:text}
.badge{margin-top:30px;filter:drop-shadow(0 20px 44px #000b)}
.badge svg{height:132px;width:auto}
.domain{margin-top:34px;font-size:34px;font-weight:800;letter-spacing:.02em;color:#9fe9ff;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.stats{margin-top:22px;font-size:26px;color:#93a6c2;font-weight:600;letter-spacing:.01em}
</style></head>
<body>
<div class="canvas"><div class="inner">
  <img class="logo" src="assets/rounds-codex-logo-clear.png" alt="Rounds Codex">
  <div class="pill"><i></i>Now on the App Store</div>
  <h1>Learn.<br><span class="u">Understand.</span><br>Succeed.</h1>
  <p class="sub">The all-in-one medical education app for <b>USMLE</b> &amp; <b>NCLEX</b>.</p>
  <div class="phones">
    <figure class="ph s l"><img src="assets/condition-guide.webp" alt=""></figure>
    <figure class="ph c"><img src="assets/app-library.webp" alt=""></figure>
    <figure class="ph s r"><img src="assets/gallery-detail.webp" alt=""></figure>
  </div>
  <div class="free">Download for FREE</div>
  <div class="stats">2,900+ questions · 183 conditions · 1,000+ illustrations</div>
  <a class="badge" aria-label="Download on the App Store">

  <div class="domain">roundscodex.com</div>
</div></div>
