<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Rounds Codex — social 1:1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
.canvas{position:relative;width:1080px;height:1080px;overflow:hidden;color:#fff;
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(circle at 50% 2%,#00b3ff40,#0000 46%),
    radial-gradient(circle at 88% 46%,#36e8b730,#0000 40%),
    radial-gradient(circle at 8% 74%,#2878ff30,#0000 42%),
    linear-gradient(#020509,#050e1d 52%,#02060e)}
.inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:50px 60px 46px}
.logo{width:252px;height:auto}
.pill{display:inline-flex;align-items:center;gap:.55rem;margin-top:18px;padding:10px 20px;border-radius:999px;
  background:#0f2a3a6b;border:1px solid #46f2ad60;color:#c9fff0;font-size:19px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.pill i{width:11px;height:11px;border-radius:50%;background:#46f2ad;box-shadow:0 0 14px #46f2ad}
h1{margin-top:20px;font-size:70px;line-height:.9;letter-spacing:-.04em;font-weight:850}
h1 .u{color:#0000;background:linear-gradient(120deg,#8fe0ff,#4bf1b0);-webkit-background-clip:text;background-clip:text}
.phones{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:15px;margin:26px 0 22px}
.phones:before{content:"";position:absolute;inset:2% 6% 0;z-index:-1;filter:blur(58px);border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#2878ff66,#0000 46%),radial-gradient(circle at 62% 60%,#36e8b74d,#0000 46%)}
.ph{width:154px;aspect-ratio:.5;border:2px solid #7ab4ff55;border-radius:26px;padding:6px;background:linear-gradient(150deg,#17253d,#02050c);
  box-shadow:0 24px 56px #000b,inset 0 0 0 2px #ffffff0d;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:21px}
.ph.s{width:126px;opacity:.92}
.ph.l{transform:perspective(1200px) rotateY(20deg) rotate(-6deg) translateY(20px)}
.ph.r{transform:perspective(1200px) rotateY(-20deg) rotate(6deg) translateY(20px)}
.ph.c{z-index:2}
.free{margin-top:20px;font-size:54px;font-weight:900;letter-spacing:-.02em;
  color:#0000;background:linear-gradient(120deg,#fff,#8fe0ff 55%,#4bf1b0);-webkit-background-clip:text;background-clip:text}
.stats{margin-top:12px;font-size:22px;color:#93a6c2;font-weight:600}
.badge{margin-top:18px;filter:drop-shadow(0 16px 36px #000b)}
.badge svg{height:88px;width:auto}
.domain{margin-top:16px;font-size:26px;font-weight:800;color:#9fe9ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style></head>
<body>
<div class="canvas"><div class="inner">
  <img class="logo" src="assets/rounds-codex-logo-clear.png" alt="Rounds Codex">
  <div class="pill"><i></i>On the App Store · Free</div>
  <h1>Learn.<br><span class="u">Understand.</span><br>Succeed.</h1>
  <div class="phones">
    <figure class="ph s l"><img src="assets/condition-guide.webp" alt=""></figure>
    <figure class="ph c"><img src="assets/app-library.webp" alt=""></figure>
    <figure class="ph s r"><img src="assets/gallery-detail.webp" alt=""></figure>
  </div>
  <div class="free">Download for FREE</div>
  <div class="stats">2,900+ questions · 183 conditions · 1,000+ illustrations</div>
  <a class="badge" aria-label="Download on the App Store">
    <svg viewBox="0 0 120 40" role="img" aria-label="Download on the App Store" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="119" height="39" rx="8.5" fill="#ffffff" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/><path fill="#000000" d="M24.77 20.6c-.03-2.68 2.19-3.97 2.29-4.03-1.25-1.83-3.19-2.08-3.88-2.11-1.65-.17-3.23.97-4.06.97-.84 0-2.13-.95-3.5-.93-1.8.03-3.47 1.05-4.4 2.66-1.88 3.26-.48 8.08 1.35 10.73.9 1.3 1.96 2.75 3.36 2.7 1.35-.05 1.86-.87 3.49-.87 1.62 0 2.08.87 3.5.84 1.45-.02 2.36-1.32 3.24-2.62 1.02-1.5 1.44-2.96 1.46-3.04-.03-.01-2.81-1.08-2.84-4.27z"/><path fill="#000000" d="M22.12 12.72c.74-.9 1.24-2.14 1.1-3.39-1.07.04-2.36.71-3.12 1.61-.68.79-1.28 2.06-1.12 3.26 1.19.1 2.41-.6 3.14-1.48z"/><text x="34" y="16.3" fill="#000000" font-family="-apple-system,'SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="6.1" font-weight="400" letter-spacing="0.15">Download on the</text><text x="33.4" y="31.2" fill="#000000" font-family="-apple-system,'SF Pro Display',BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.2" font-weight="590" letter-spacing="-0.8">App Store</text></svg>
  </a>
  <div class="domain">roundscodex.com</div>
</div></div>
</body></html>
