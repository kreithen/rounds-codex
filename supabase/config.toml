# Supabase project config (for the CLI).
project_id = "emdrmxscgmnfxgvimbqn"

# These functions are called by a database webhook / public email links,
# so they must NOT require a user JWT.
[functions.welcome]
verify_jwt = false

[functions.unsubscribe]
verify_jwt = false

# draft + send-campaign are called from the admin dashboard. verify_jwt is off
# so CORS preflight (OPTIONS, no JWT) succeeds; each function checks admin
# membership manually before spending Anthropic credits or sending mail.
[functions.draft]
verify_jwt = false

[functions.send-campaign]
verify_jwt = false

# Support inbox. inbox-reply + inbox-draft are called from the dashboard
# (verify_jwt off + manual admin check). sync-inbox is called by pg_cron with
# the service_role key, so it keeps JWT verification ON (rejects anonymous callers).
[functions.inbox-reply]
verify_jwt = false

[functions.inbox-draft]
verify_jwt = false

[functions.sync-inbox]
verify_jwt = true

# App login-wall: admin invites a user; verify_jwt off + manual admin check.
[functions.invite-user]
verify_jwt = false

# Compose a fresh email to a signup from admin@; verify_jwt off + manual admin check.
[functions.send-email]
verify_jwt = false

# One-time browser helper to exchange a Zoho grant code for a refresh token.
[functions.zoho-connect]
verify_jwt = false
